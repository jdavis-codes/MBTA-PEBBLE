<!doctype html><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MBTA Pebble watch guides</title>
<!-- Source for the annotated guides. The hash picks the guide: #line (the
     default), #board or #dial. Render #c with a headless browser.
       #line  -> watch-guide.png   (screen: watch-screen.png)
       #board -> guide-board.png   (screen: screen-guide-board.png)
       #dial  -> guide-dial.png    (screen: screen-guide-dial.png)
     Add -m for one guide as a narrow page, e.g. #board-m -> guide-board-mobile.png
     (rendered 800px wide). #m, or opening the page on a phone, shows all three
     narrow guides on one scrolling page.
     Each screen is a 144x168 capture of the watch showing demo data. -->
<style>
body{margin:0;background:#fff;font-family:"DejaVu Sans","Liberation Sans",sans-serif;color:#111}
#c{position:relative;background:#fff}
#w{position:absolute;image-rendering:pixelated;border:8px solid #111;border-radius:12px;margin:-8px}
svg{position:absolute;left:0;top:0}
.t{position:absolute;font-size:19px;line-height:1.32}
.t b{display:block;font-size:22px;margin-bottom:3px}
.t ul{display:inline-block;margin:2px 0 0;padding-left:1.15em;text-align:left}
.t li{margin:1px 0}
.l{text-align:right}
/* The narrow page fills the screen width up to 800px and scrolls. */
.m{width:auto!important;max-width:800px;margin:0 auto;font-size:clamp(15px,3.1vw,25px);line-height:1.34}
.m svg{position:static;display:block;width:100%;height:auto}
.m h2{font-size:1.3em;margin:1.1em 5% .2em}
.m .list{padding:1.2em 5% .6em}
.m .e{display:flex;gap:.65em;margin:0 0 .85em}
.m .e b{display:block;font-size:1.12em;margin-bottom:.08em}
.m .n{flex:none;box-sizing:border-box;min-width:1.55em;padding:0 .3em;height:1.55em;border-radius:1em;background:#e3121b;color:#fff;font-weight:bold;font-size:.92em;line-height:1.55em;text-align:center;margin-top:.06em}
.m .k{display:inline-block;background:#e3121b;color:#fff;font-weight:bold;font-size:.8em;line-height:1.5;padding:0 .5em;border-radius:1em;vertical-align:.08em}
.m ul{margin:.1em 0 0;padding-left:1.15em}.m li{margin:.08em 0}
</style>

// The hash picks what is shown:
//   #board     the wide guide, callouts on both sides (also #line, #dial)
//   #board-m   that guide as a narrow page: numbered markers, shorter list
//   #m         all three narrow guides on one scrolling page; this is also
//              what a phone gets when the page is opened without a hash.
var hash=location.hash.slice(1),parts=hash.split('-');
var ALL=hash==='m'||(!hash&&Math.min(window.innerWidth,screen.width)<900);
var guide=GUIDES[parts[0]]||GUIDES.line,items=guide.items;
var c=document.getElementById('c'),w=document.getElementById('w'),R='#e3121b';
var W=2000,TW=470,TL=20,TR=1510;
if(ALL||parts[1]==='m'){
  w.remove();document.getElementById('s').remove();c.className='m';
  c.innerHTML=(ALL?['line','board','dial']:[parts[0]]).map(narrow).join('');
}else{
  c.style.width=W+'px';w.src=guide.img;Y0=guide.y0;
  w.style.left=X0+'px';w.style.top=Y0+'px';w.style.width=144*K+'px';w.style.height=168*K+'px';
  wide();
}

function bodyHtml(text){
  var out='',open=false;
  text.split('<br>').forEach(function(line,i){
    var li=line.indexOf('- ')===0;
    if(li&&!open){out+='<ul>';open=true;}
    if(!li&&open){out+='</ul>';open=false;}
    out+=li?'<li>'+line.slice(2)+'</li>':(i&&!out.match(/<\/ul>$/)?'<br>':'')+line;
  });
  return out+(open?'</ul>':'');
}
function wide(){
items.forEach(function(it){
  it.el=document.createElement('div');it.el.className='t '+it.side;
  it.el.style.width=TW+'px';it.el.style.left=(it.side==='l'?TL:TR)+'px';
  it.el.innerHTML='<b>'+it.title+'</b>'+bodyHtml(it.body);c.appendChild(it.el);
  it.h=it.el.offsetHeight;
});
items.forEach(function(it){
  if(it.box) it.b={x1:px(it.box[0]),y1:py(it.box[1]),x2:px(it.box[2]),y2:py(it.box[3])};
  else{var r=it.circ[2]*K;it.b={x1:px(it.circ[0])-r,y1:py(it.circ[1])-r,x2:px(it.circ[0])+r,y2:py(it.circ[1])+r,c:1};}
  it.want=it.top?it.top:(it.ty||(it.b.y1+it.b.y2)/2);
});
var H=Y0+168*K+40;
['l','r'].forEach(function(side){
  var col=items.filter(function(i){return i.side===side}).sort(function(a,b){return a.want-b.want});
  col.forEach(function(it,i){
    it.y=Math.max(it.want,it.h/2+16);
    if(i>0){var p=col[i-1],min=p.y+p.h/2+GAP+it.h/2;if(it.y<min)it.y=min;}
  });
  // A column taller than the watch makes the picture taller instead of overlapping.
  if(col.length){var last=col[col.length-1];H=Math.max(H,last.y+last.h/2+16);}
  for(var i=col.length-1;i>=0;i--){
    var max=i===col.length-1?H-16-col[i].h/2:col[i+1].y-col[i+1].h/2-GAP-col[i].h/2;
    if(col[i].y>max)col[i].y=max;
  }
});
var svg='<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="'+R+'"/></marker></defs>';
items.forEach(function(it){
  var b=it.b,left=it.side==='l',sx=left?LX:RX,cx=(b.x1+b.x2)/2,cy=(b.y1+b.y2)/2,d;
  it.el.style.top=(it.y-it.h/2)+'px';
  if(b.c) svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(b.x2-b.x1)/2+'" fill="none" stroke="'+R+'" stroke-width="5"/>';
  else svg+='<rect x="'+b.x1+'" y="'+b.y1+'" width="'+(b.x2-b.x1)+'" height="'+(b.y2-b.y1)+'" rx="6" fill="none" stroke="'+R+'" stroke-width="5"/>';
  var ay=it.y-it.h/2+15; // top arrows leave from the title line
  if(it.top) d='M'+sx+','+ay+' L'+cx+','+ay+' L'+cx+','+(b.y1-5);
  else if(it.at) d='M'+sx+','+it.y+' L'+px(it.at[0])+','+py(it.at[1]);
  else{
    var ex=left?b.x1-5:b.x2+5,ey=Math.max(b.y1+8,Math.min(b.y2-8,it.y));
    if(b.c){var dx=sx-cx,dy=it.y-cy,n=Math.sqrt(dx*dx+dy*dy),rr=(b.x2-b.x1)/2+5;ex=cx+dx/n*rr;ey=cy+dy/n*rr;}
    d='M'+sx+','+it.y+' L'+ex+','+ey;
  }
  svg+='<path d="'+d+'" fill="none" stroke="'+R+'" stroke-width="4.5" stroke-linejoin="round" marker-end="url(#a)"/>';
});
c.style.height=H+'px';var sv=document.getElementById('s');sv.setAttribute('width',W);sv.setAttribute('height',H);sv.innerHTML=svg;
}

// The narrow page. Everything on the watch is drawn inside one SVG with a
// fixed 800-unit-wide coordinate system, so the picture and its markers scale
// together to the width of the screen; the list underneath is ordinary text.
function narrow(key){
  var g=GUIDES[key],NW=800,BR=17;
  K=5;X0=40;Y0=34;
  var entries=g.mobile;
  entries.forEach(function(e){
    e.marks.forEach(function(m){
      if(m.box) m.b={x1:px(m.box[0]),y1:py(m.box[1]),x2:px(m.box[2]),y2:py(m.box[3])};
      else{var r=m.circ[2]*K;m.b={x1:px(m.circ[0])-r,y1:py(m.circ[1])-r,x2:px(m.circ[0])+r,y2:py(m.circ[1])+r,c:1};}
    });
  });
  // Entries are numbered in the order they are written: trains first, then what
  // can happen to a train, then Bluebikes, then the connection dots. An entry
  // with several marks numbers them 1.1, 1.2 and so on, and names each one in
  // its text with {1}, {2}.
  function badge(x,y,text){
    var bw=Math.max(2*BR,16+text.length*12);
    x=Math.max(bw/2+2,Math.min(NW-bw/2-2,x));y=Math.max(BR+2,y);
    return '<rect x="'+(x-bw/2)+'" y="'+(y-BR)+'" width="'+bw+'" height="'+2*BR+'" rx="'+BR+'" fill="'+R+'" stroke="#fff" stroke-width="2.5"/>'+
           '<text x="'+x+'" y="'+(y+7.5)+'" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">'+text+'</text>';
  }
  var SH=Y0+168*K+30;
  var svg='<rect x="'+(X0-8)+'" y="'+(Y0-8)+'" width="'+(144*K+16)+'" height="'+(168*K+16)+'" rx="12" fill="#111"/>'+
          '<image href="'+g.img+'" x="'+X0+'" y="'+Y0+'" width="'+144*K+'" height="'+168*K+'" style="image-rendering:pixelated"/>';
  var list='',badges='';
  entries.forEach(function(e,i){
    function inline(text){
      return text.replace(/\{(\d)\}/g,function(_,k){return '<span class="k">'+(i+1)+'.'+k+'</span>'});
    }
    e.marks.forEach(function(m,k){
      var b=m.b,cx=(b.x1+b.x2)/2,cy=(b.y1+b.y2)/2,r=(b.x2-b.x1)/2,bx,by;
      var text=(i+1)+(e.marks.length>1?'.'+(k+1):'');
      if(b.c) svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+R+'" stroke-width="5"/>';
      else svg+='<rect x="'+b.x1+'" y="'+b.y1+'" width="'+(b.x2-b.x1)+'" height="'+(b.y2-b.y1)+'" rx="6" fill="none" stroke="'+R+'" stroke-width="5"/>';
      // The marker sits on the shape's top left corner, or beside a small circle.
      if(m.badge){bx=px(m.badge[0]);by=py(m.badge[1]);}
      else if(b.c&&r<30){bx=cx-r-(16+text.length*12)/2-2;by=cy;}
      else if(b.c){bx=cx-r*0.72;by=cy-r*0.72;}
      else{bx=b.x1;by=b.y1;}
      badges+=badge(bx,by,text);
    });
    list+='<div class="e"><span class="n">'+(i+1)+'</span><div><b>'+inline(e.title)+'</b>'+bodyHtml(inline(e.body))+'</div></div>';
  });
  return '<section class="g"'+(g.name?' id="'+key+'"':'')+'>'+(ALL?'<h2>'+g.name+'</h2>':'')+
         '<svg viewBox="0 0 '+NW+' '+SH+'" xmlns="http://www.w3.org/2000/svg">'+svg+badges+'</svg>'+
         '<div class="list">'+list+'</div></section>';
}
</script>
